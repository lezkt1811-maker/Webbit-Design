<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{NAME}} | {{AREA}}</title><meta name="description" content="{{TAGLINE}}"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap"><style>*{box-sizing:border-box}body{margin:0}ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;gap:12px}li b{white-space:nowrap}body{background:#0a0b14;color:#eef0ff;font:17px/1.55 Sora,sans-serif}.wrap{max-width:640px;margin:0 auto;padding:40px 20px}.badge{display:inline-block;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:{{COLOR}};border:1px solid {{COLOR}};border-radius:99px;padding:4px 12px}h1{font-weight:800;font-size:clamp(34px,9vw,58px);line-height:1.02;margin:18px 0 10px;text-shadow:0 0 24px {{COLOR}}}p.t{color:#b9bdd9;font-size:19px;margin:0 0 24px}.call{display:block;text-align:center;background:{{COLOR}};color:#fff;font-weight:800;font-size:20px;text-decoration:none;padding:16px;border-radius:14px;box-shadow:0 0 30px {{COLOR}}}.box{margin-top:26px;border:1px solid #2a2d48;border-radius:16px;padding:18px;background:#11132080}h2{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:{{COLOR}};margin:0 0 8px}li{padding:10px 0;border-bottom:1px solid #22253d}li:last-child{border:0}.box p{margin:4px 0;color:#cfd2ee}footer{color:#6f7396;font-size:13px;text-align:center;padding:30px 0 10px}</style></head><body><div class="wrap"><span class="badge">{{ICON}} {{AREA}}</span><h1>{{NAME}}</h1><p class="t">{{TAGLINE}}</p><a class="call" href="tel:{{TEL}}">Call {{PHONE}}</a><div class="box"><h2>Services</h2><ul>{{SERVICES}}</ul></div><div class="box"><h2>Hours</h2><p><b>{{HOURS}}</b></p><p>{{ADDRESS}}</p><p>{{EXTRA}}</p></div><footer>© {{YEAR}} {{NAME}}</footer></div></body></html>
